name: social_discovery
description: Premium video first social discovery.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 2.6.1
  go_router: 16.2.4
  supabase_flutter: 2.10.3
  video_player: 2.10.0
  camera: 0.11.2
  image_picker: 1.2.0
  file_picker: 10.3.3
  crypto: 3.0.6
  http: 1.5.0
  shared_preferences: 2.5.3
  path_provider: 2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
